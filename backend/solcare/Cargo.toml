[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.dependencies]
toml_datetime = "=0.6.8"
toml_edit = "=0.21.0"
indexmap = "=2.2.6"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

